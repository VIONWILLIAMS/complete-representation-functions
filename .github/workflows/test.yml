name: CRF Verification

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate:claims

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: graphics-editor/editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: graphics-editor/editor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:v10
      - run: npm run test:v11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-build.txt -r requirements.txt
      - run: npm run test:quality
      - run: OPENBLAS_NUM_THREADS=1 OMP_NUM_THREADS=2 python3 tests/test_quality12.py
      - run: npm run build
